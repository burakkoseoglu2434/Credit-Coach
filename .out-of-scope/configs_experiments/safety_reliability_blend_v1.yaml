# safety.yaml — Bootstrap CI istatistiksel güvenlik yapılandırması

bootstrap:
  B: 500                       # Bootstrap örnekleme sayısı (B=500 yeterli, B=1000 daha güçlü)
  random_state: 42

confidence:
  base_alpha: 0.05             # Normal koşullarda: CI üst %5'i aşmamalı
  high_stress_alpha: 0.01      # MSI > 0.7 ise: CI üst %1'i aşmamalı

uncertainty:
  primary_method: conformal    # bootstrap | conformal | hybrid
  bootstrap_sigma: 0.03
  random_state: 42
  reliability_gate_mode: blend # hard | soft | blend
  reliability_soft_weight: 0.70
  reliability_soft_scale: 0.20
  profiles:
    near:
      width_multiplier: 1.00
      sigma_multiplier: 1.00
      alpha_multiplier: 1.00
    mid:
      width_multiplier: 1.08
      sigma_multiplier: 1.05
      alpha_multiplier: 0.95
    high:
      width_multiplier: 1.20
      sigma_multiplier: 1.10
      alpha_multiplier: 0.90
    denied_width_multiplier: 1.05
    denied_sigma_multiplier: 1.00
    denied_alpha_multiplier: 0.95
  conformal:
    residual_quantile: 0.06
    min_width: 0.005
    calibration_artifact_path: ""   # boşsa latest manifestteki conformal_calibration_path kullanilir
    adaptive_by_score: true
    adaptive_mode: cap
    adaptive_blend: 1.0
    adaptive_gap_weight: 0.0
    max_width: 0.08

# Kabul kuralı: CI_high <= tau_t  → APPROVED
# Aksi hâlde       → NEEDS_REVIEW

status_mapping:
  APPROVED: "CI üst bandı eşik altında — plan güvenli"
  NEEDS_REVIEW: "CI üst bandı eşiği aşıyor — ek inceleme gerekli"
  REJECTED: "Fizibilite testi başarısız — plan reddedildi"

feasibility:
  direction_strict: true       # Yanlış yöndeki aksiyonlar reddedilir (ör. borcu artır)
