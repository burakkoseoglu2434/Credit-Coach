[project]
name = "credit-coach-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "mlflow>=3.18.0",
  "pandas>=3.1.1",
  "pandera>=0.36.0",
  "pydantic>=2.8",
  "pyyaml>=6.0.3",
  "scikit-learn>=1.9.1",
  "uvicorn>=0.30",
  "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_coach"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
