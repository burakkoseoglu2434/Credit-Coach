# coaching.yaml — Haftalık koçluk döngüsü yapılandırması

# İlerleme sınıflandırma eşikleri (delta_p = p_t - p_{t-1})
progress:
  improving_threshold: -0.02    # delta_p < -0.02: improving (risk azaldı)
  stagnant_threshold: 0.02     # -0.02 <= delta_p <= 0.02: stagnant
  # delta_p > 0.02: deteriorating (risk arttı)

# Replan tetikleyicileri
replan_triggers:
  status_deteriorating: true   # durum kötüleşirse replan
  ci_exceed_tau: true          # CI_high > tau_t ise replan
  missed_actions: 2            # 2 hafta üst üste aksiyon yapılmadıysa replan

# Sequential execution modeli
sequential:
  default_plan_action_count: 6
  max_weekly_actions: 3
  target_pd_margin_under_tau: 0.01
  action_dropout_prob: 0.15
  execution_noise_std: 0.003
  action_effect_per_step: 0.005
  ci_buffer: 0.02
  random_state: 42
  # opsiyonel: haftaya gore makro sok schedule
  # macro_shock_schedule:
  #   - week: 3
  #     changes:
  #       interest_rate: 3.0
  #       unemployment_rate: 2.0
  macro_shock_schedule: []

robust_gates:
  min_robust_margin: -0.05

# Demo senaryosu
demo:
  weeks: 4                     # 4 haftalık simülasyon
  macro_shock_week: 3          # 3. haftada makro şok eventi

# Mesajlaşma (progressive disclosure)
messaging:
  max_reasons_shown: 3         # Müşteriye gösterilecek max neden
  language: tr                 # "tr" | "en"
