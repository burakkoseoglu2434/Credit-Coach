# model.yaml — XGBoost model ve kalibrasyon yapılandırması

model:
  type: xgboost
  params:
    allow_xgboost: true
    fallback_on_error: true
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
    scale_pos_weight: 3.0     # Dengesiz sınıf için (temerrüt azınlık)
    use_label_encoder: false
    eval_metric: auc
    random_state: 42
    n_jobs: 1
    # monotone_constraints can be dict/list/string.
    # dict example: {"annual_inc": -1, "dti": 1}
    monotone_constraints: {}

calibration:
  method: isotonic            # "isotonic" veya "sigmoid" (Platt)
  cv: 5
  holdout_size: 0.20

decision:
  tau_0: 0.35                 # Temel karar eşiği (makro etkisiyle değişebilir)

registry:
  path: artifacts/models/
  format: joblib              # model.joblib + calibrator.joblib
