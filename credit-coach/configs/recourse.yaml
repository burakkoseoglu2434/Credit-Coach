# recourse.yaml — Recourse üretimi yapılandırması

horizons: [3, 6, 12]          # Ay cinsinden planlama ufukları

strategies:
  - conservative               # Düşük risk, az değişim
  - balanced                   # Denge
  - aggressive                 # Yüksek değişim, daha hızlı hedef

min_abs_action_delta: 1.0e-6

shap:
  topk_features: 10            # Local SHAP'tan kaç feature seçilir
  stability_perturbations: 6   # Explainability stabilite ölçümü için perturbasyon sayısı
  stability_noise_std: 0.01    # Perturbasyon gürültü ölçeği
  stability_seed: 42
  background_samples: 256      # SHAP background ornek sayisi
  batch_background_samples: 96
  batch_use_model_coef_proxy: true

dice:
  method: random               # random | genetic | kdtree
  enable_method_fallback: true # Method bazli hata olursa diger DiCE yöntemlerini dener
  total_cfs: 6
  seed: 42
  max_actions: 3
  timeout_ms: 1500

robust:
  enabled: true
  objective: cvar              # cvar | worst_case
  cvar_quantile: 0.90
  min_reliability: 0.40
  min_worst_risk_margin: -0.12
  weights:
    nominal_margin: 0.45
    reliability: 0.35
    robust_margin: 0.20
  gate_objective:
    alpha: 0.05
    penalty_scale: 40.0
    min_reliability: 0.38
    min_worst_risk_margin: -0.12
    fairness_weight: 1.0
    violation_weights:
      ci: 0.50
      reliability: 0.15
      worst_margin: 0.15
    uncertainty:
      method: conformal         # bootstrap | conformal
      bootstrap_b: 300
      sigma: 0.03
      conformal_residual_quantile: 0.06
      conformal_min_width: 0.005
      calibration_artifact_path: ""  # bos ise latest model manifestten otomatik doldurulur
  denied_objective:
    enabled: true
    only_denied: true
    penalty_scale: 70.0
    squared_violation: true
    weights:
      ci: 0.55
      reliability: 0.25
      worst_margin: 0.20
      cost: 0.06
      sparsity: 0.02
      nominal_margin: 0.35
    risk_band_weight_multipliers:
      near:
        ci: 1.00
        reliability: 1.00
        worst_margin: 1.00
      mid:
        ci: 1.05
        reliability: 1.10
        worst_margin: 1.10
      high:
        ci: 1.15
        reliability: 1.20
        worst_margin: 1.20
    high_risk_objective:
      enabled: true
      penalty_scale: 80.0
      hard_gate: true
      hard_violation_penalty: 120.0
      weights:
        pd_improvement: 0.55
        gate_pass: 0.20
        residual_pd: 0.25
        ci: 0.35
        reliability: 0.20
        worst_margin: 0.20
        cost: 0.03
        sparsity: 0.02

high_risk_bridge_kpi:
  enabled: true
  target_pd_delta_to_tau: 0.20
  min_pd_reduction: 0.08

adaptive_steps:
  enabled: true
  only_denied: true
  growth_factor: 1.5
  max_multiplier: 4.0
  max_attempts_per_feature: 2
  min_pd_improvement: 0.001
  required_share_per_feature: 0.35
  sensitivity_gain: 0.5

denied_target:
  enabled: true
  activation_margin: 0.00
  topk_multiplier: 1.8
  min_topk: 12
  horizons: [3, 6]
  strategies: [balanced, aggressive]
  strict_min_reliability: 0.38
  strict_min_worst_risk_margin: -0.12
  dice_total_cfs_multiplier: 1.5
  dice_max_actions_multiplier: 1.35
  max_actions: 8
  distance_profiles:
    near:
      max_pd_delta: 0.05
      horizons: [3, 6]
      strategies: [balanced, aggressive]
      topk_multiplier: 1.20
      max_actions: 8
      enable_weekly_optimizer: true
      disable_adaptive_steps: false
      skip_dice: false
    mid:
      max_pd_delta: 0.10
      horizons: [3]
      strategies: [balanced]
      topk: 10
      max_actions: 6
      enable_weekly_optimizer: false
      disable_adaptive_steps: true
      skip_dice: true
    far:
      max_pd_delta: 1.00
      horizons: [3, 6, 12]
      strategies: [balanced, aggressive]
      topk: 12
      max_actions: 8
      enable_weekly_optimizer: true
      disable_adaptive_steps: false
      skip_dice: false

trajectory:
  enabled: true
  checkpoints_months: [1, 3, 6]
  partial_progress_min_pd_delta: 0.05

segment_caps:
  enabled: true
  denied_only: true
  income_quantiles: [0.25, 0.50, 0.75]
  risk_band_thresholds:
    near_upper: 0.10
    mid_upper: 0.25
  income_band_multipliers:
    q1: 1.05
    q2: 1.10
    q3: 1.15
    q4: 1.20
  risk_band_multipliers:
    near: 1.20
    mid: 1.65
    high: 2.40
  cap_multiplier_min: 1.00
  cap_multiplier_max: 2.20
  feature_cap_multipliers:
    annual_inc:
      income_band_multipliers:
        q1: 0.85
        q2: 0.90
        q3: 1.00
        q4: 1.10
    dti:
      risk_band_multipliers:
        near: 1.00
        mid: 1.30
        high: 1.55
    revol_util:
      risk_band_multipliers:
        near: 1.00
        mid: 1.30
        high: 1.55

weekly_optimizer:
  enabled: true
  only_denied: true
  weeks: 12
  max_weekly_actions: 3
  weekly_step_scale: 0.50
  min_weekly_improvement: 0.0002
  stop_when_target_hit: true
  optimize_for_gate: true
  objective_bootstrap_b: 80

action_budget:
  enabled: true
  max_actions_regular: 4
  max_actions_denied: 8

search_budget:
  per_customer_time_budget_ms: 1600
  candidate_pool_max_size: 10
  stage1_filter_multiplier: 1.5
  stage1_per_source_cap: 6
  regular_horizons: [3, 6]
  regular_strategies: [conservative]
  regular_topk: 6
  novelty_weight: 0.35
  skip_dice_when_internal_approved: true
  skip_dice_for_non_denied: true
  denied_target_max_customers: 300
  denied_target_dynamic_max_enabled: true
  denied_target_dynamic_max_cap: 300
  denied_target_segment_reservation_enabled: true
  denied_target_risk_band_reservation:
    high: 0.50
    mid: 0.25
    near: 0.25
  denied_dice_max_customers: 40
  dice_only_high_risk_denied: false
  min_remaining_budget_for_dice_ms: 250
  min_remaining_budget_for_rule_ms: 80
  hard_max_dice_timeout_ms: 800
  hard_time_budget_enforcement: true
  enable_deterministic_fallback: true

high_risk_profile:
  enabled: true
  denied_target_only: true
  max_pd_delta: 1.00
  topk_multiplier: 1.35
  min_topk: 12
  horizons: [3, 6, 12]
  strategies: [balanced, aggressive]
  force_weekly_optimizer: true
  weekly_weeks: 8
  weekly_max_actions: 2
  max_actions: 8
  min_reliability: 0.38
  min_worst_risk_margin: -0.12
  target_pd_margin_extra: 0.020
  dice_total_cfs_multiplier: 2.00
  dice_max_actions_multiplier: 1.50

rule_generator:
  enabled: true
  max_actions: 3
  only_last_resort: false

feasibility:
  enabled: true
  profile_path: configs/recourse_feasibility.yaml
  enforce_on_internal: true
  enforce_on_dice: true

fairness:
  group_feature: home_ownership
  advantage_tolerance: 0.01
  penalty_sample_n: 3000
  penalty_seed: 42

beam_search:
  width: 5                     # Beam genişliği
  max_actions: 6               # Bir planda maksimum aksiyon sayısı
  max_iterations: 200

cost_weights:
  lambda_l1: 1.0               # L1 uzaklık ağırlığı
  lambda_time: 0.5             # Zaman maliyeti ağırlığı
  lambda_financial: 0.8        # Finansal maliyet ağırlığı

output:
  save_json: true
  save_csv: true
  path: artifacts/runs/
