model:
  type: logistic_regression
  params:
    allow_xgboost: false
    fallback_on_error: true
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
    scale_pos_weight: 3.0
    use_label_encoder: false
    eval_metric: auc
    random_state: 42
    n_jobs: 1
    monotone_constraints: {}

calibration:
  method: isotonic
  cv: 5
  holdout_size: 0.20

decision:
  tau_0: 0.35

registry:
  path: artifacts/models_website_demo/
  format: joblib
