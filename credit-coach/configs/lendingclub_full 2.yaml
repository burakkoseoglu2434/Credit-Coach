# lendingclub_full.yaml — Phase 70 large-data base config (non-destructive)
#
# Constraints:
# - No model / threshold / planner / recourse logic changes.
# - 48-column contract stays locked via `configs/features_48.yaml` (47 features + target).
# - Full dataset outputs must not overwrite the small baseline processed roots.

project:
  name: credit-coach
  version: "0.1.0"

paths:
  raw_data: data/raw/
  processed_data: data/processed_lendingclub_full/
  splits: data/splits_lendingclub_full/
  artifacts: artifacts/
  configs: configs/
  # NOTE: Use CSV as the raw source to avoid Parquet reader incompatibilities across Arrow versions.
  raw_csv: data/lending_club/lending_club_48_features_20251026_114053.csv

logging:
  level: INFO
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"

database:
  url: "sqlite:///./credit_coach_state.db"

features_config: configs/features_48.yaml

prepare_data:
  test_size: 0.2
  random_state: 42
  sample_rows: null
  out_of_time: false

split_protocol:
  out_of_time: false
  time_column: issue_d
  random_state: 42
