# website_demo.yaml
# credit-coach-website icin izole ornek veri ve state konfigurasyonu

project:
  name: credit-coach-website-demo
  version: "0.1.0"

paths:
  raw_data: data/sample/
  processed_data: data/website_demo/processed/
  splits: data/website_demo/splits/
  artifacts: artifacts/
  configs: configs/
  raw_csv: data/sample/lending_club_sample_2000.csv

logging:
  level: INFO
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"

database:
  url: "sqlite:///./credit_coach_demo_state.db"

features_config: configs/features_48.yaml

prepare_data:
  test_size: 0.2
  random_state: 42
  sample_rows: 2000
  out_of_time: false

split_protocol:
  out_of_time: false
  time_column: issue_d
  random_state: 42
