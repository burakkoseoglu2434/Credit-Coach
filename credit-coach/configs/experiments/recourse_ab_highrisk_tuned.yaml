# recourse.yaml — Recourse üretimi yapılandırması

horizons: [3, 6, 12]          # Ay cinsinden planlama ufukları

strategies:
  - conservative               # Düşük risk, az değişim
  - balanced                   # Denge
  - aggressive                 # Yüksek değişim, daha hızlı hedef

shap:
  topk_features: 10            # Local SHAP'tan kaç feature seçilir
  stability_perturbations: 6   # Explainability stabilite ölçümü için perturbasyon sayısı
  stability_noise_std: 0.01    # Perturbasyon gürültü ölçeği
  stability_seed: 42
  background_samples: 256      # SHAP background ornek sayisi

dice:
  method: random               # random | genetic | kdtree
  enable_method_fallback: true # Method bazli hata olursa diger DiCE yöntemlerini dener
  total_cfs: 2
  seed: 42
  max_actions: 2
  timeout_ms: 0                # 0 ise timeout kapalı

robust:
  enabled: true
  objective: cvar              # cvar | worst_case
  cvar_quantile: 0.90
  min_reliability: 0.70
  min_worst_risk_margin: -0.05
  weights:
    nominal_margin: 0.35
    reliability: 0.45
    robust_margin: 0.20
  gate_objective:
    alpha: 0.05
    penalty_scale: 100.0
    min_reliability: 0.70
    min_worst_risk_margin: -0.05
    fairness_weight: 2.0
    violation_weights:
      ci: 0.50
      reliability: 0.30
      worst_margin: 0.20
    uncertainty:
      method: conformal         # bootstrap | conformal
      bootstrap_b: 300
      sigma: 0.03
      conformal_residual_quantile: 0.06
      conformal_min_width: 0.005
      calibration_artifact_path: ""  # bos ise latest model manifestten otomatik doldurulur
  denied_objective:
    enabled: true
    only_denied: true
    penalty_scale: 120.0
    squared_violation: true
    weights:
      ci: 0.45
      reliability: 0.30
      worst_margin: 0.20
      cost: 0.03
      sparsity: 0.02
      nominal_margin: 0.20
    risk_band_weight_multipliers:
      near:
        ci: 1.00
        reliability: 1.00
        worst_margin: 1.00
      mid:
        ci: 1.05
        reliability: 1.10
        worst_margin: 1.10
      high:
        ci: 1.30
        reliability: 1.35
        worst_margin: 1.35
        cost: 0.80
        sparsity: 0.80

adaptive_steps:
  enabled: true
  only_denied: true
  growth_factor: 1.5
  max_multiplier: 4.0
  max_attempts_per_feature: 2
  min_pd_improvement: 0.001
  required_share_per_feature: 0.35
  sensitivity_gain: 0.5

denied_target:
  enabled: true
  activation_margin: 0.00
  topk_multiplier: 2.4
  min_topk: 16
  horizons: [6, 12]
  strategies: [balanced, aggressive]
  strict_min_reliability: 0.66
  strict_min_worst_risk_margin: -0.08
  dice_total_cfs_multiplier: 2.0
  dice_max_actions_multiplier: 2.0
  max_actions: 12

segment_caps:
  enabled: true
  denied_only: true
  income_quantiles: [0.25, 0.50, 0.75]
  risk_band_thresholds:
    near_upper: 0.10
    mid_upper: 0.25
  income_band_multipliers:
    q1: 1.05
    q2: 1.10
    q3: 1.15
    q4: 1.20
  risk_band_multipliers:
    near: 1.20
    mid: 1.45
    high: 2.10
  cap_multiplier_min: 1.00
  cap_multiplier_max: 2.50
  feature_cap_multipliers:
    annual_inc:
      income_band_multipliers:
        q1: 0.85
        q2: 0.90
        q3: 1.00
        q4: 1.10
    dti:
      risk_band_multipliers:
        near: 1.00
        mid: 1.10
        high: 1.20
    revol_util:
      risk_band_multipliers:
        near: 1.00
        mid: 1.10
        high: 1.20

weekly_optimizer:
  enabled: true
  only_denied: true
  weeks: 12
  max_weekly_actions: 3
  weekly_step_scale: 0.45
  min_weekly_improvement: 0.0005
  stop_when_target_hit: true
  optimize_for_gate: true
  objective_bootstrap_b: 120

action_budget:
  enabled: true
  max_actions_regular: 4
  max_actions_denied: 8

search_budget:
  per_customer_time_budget_ms: 3000
  candidate_pool_max_size: 20
  skip_dice_when_internal_approved: true
  skip_dice_for_non_denied: true
  denied_dice_max_customers: 300

feasibility:
  enabled: true
  profile_path: configs/recourse_feasibility.yaml
  enforce_on_internal: true
  enforce_on_dice: true

fairness:
  group_feature: home_ownership
  advantage_tolerance: 0.01
  penalty_sample_n: 3000
  penalty_seed: 42

beam_search:
  width: 5                     # Beam genişliği
  max_actions: 6               # Bir planda maksimum aksiyon sayısı
  max_iterations: 200

cost_weights:
  lambda_l1: 1.0               # L1 uzaklık ağırlığı
  lambda_time: 0.5             # Zaman maliyeti ağırlığı
  lambda_financial: 0.8        # Finansal maliyet ağırlığı

output:
  save_json: true
  save_csv: true
  path: artifacts/runs/
