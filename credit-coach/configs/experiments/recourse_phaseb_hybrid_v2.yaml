# recourse.yaml — Recourse üretimi yapılandırması

horizons: [3, 6, 12]          # Ay cinsinden planlama ufukları

strategies:
  - conservative               # Düşük risk, az değişim
  - balanced                   # Denge
  - aggressive                 # Yüksek değişim, daha hızlı hedef

min_abs_action_delta: 1.0e-6

shap:
  topk_features: 10            # Local SHAP'tan kaç feature seçilir
  stability_perturbations: 6   # Explainability stabilite ölçümü için perturbasyon sayısı
  stability_noise_std: 0.01    # Perturbasyon gürültü ölçeği
  stability_seed: 42
  background_samples: 256      # SHAP background ornek sayisi
  batch_background_samples: 96
  batch_use_model_coef_proxy: true

dice:
  method: random               # random | genetic | kdtree
  enable_method_fallback: false # Method bazli hata olursa diger DiCE yöntemlerini dener
  total_cfs: 2
  seed: 42
  max_actions: 8
  timeout_ms: 900

robust:
  enabled: true
  objective: cvar              # cvar | worst_case
  cvar_quantile: 0.90
  min_reliability: 0.45
  min_worst_risk_margin: -0.05
  weights:
    nominal_margin: 0.45
    reliability: 0.35
    robust_margin: 0.20
  gate_objective:
    alpha: 0.10
    penalty_scale: 90.0
    min_reliability: 0.45
    min_worst_risk_margin: -0.05
    fairness_weight: 4.0
    violation_weights:
      ci: 0.50
      reliability: 0.30
      worst_margin: 0.20
    uncertainty:
      method: conformal         # bootstrap | conformal
      bootstrap_b: 300
      sigma: 0.03
      conformal_residual_quantile: 0.03
      conformal_min_width: 0.002
      calibration_artifact_path: ""  # bos ise latest model manifestten otomatik doldurulur
  denied_objective:
    enabled: true
    only_denied: true
    penalty_scale: 120.0
    squared_violation: true
    weights:
      ci: 0.50
      reliability: 0.24
      worst_margin: 0.20
      cost: 0.04
      sparsity: 0.03
      nominal_margin: 0.30
      short_term: 0.18
    short_term:
      enabled: true
      denied_only: true
      phase1_cutoff_month: 1
      phase2_cutoff_month: 3
      phase1_share_weight: 1.0
      phase2_share_weight: 0.35
      base_reduction_weight: 0.25
      min_phase1_actions: 1
      high_risk_multiplier: 1.20
    fairness_balance:
      enabled: true
      penalty_threshold: 0.07
      advantaged_cost_scale: 0.20
      disadvantaged_gate_bonus: 0.30
    risk_band_weight_multipliers:
      near:
        ci: 1.00
        reliability: 1.00
        worst_margin: 1.00
      mid:
        ci: 1.05
        reliability: 1.10
        worst_margin: 1.10
      high:
        ci: 1.22
        reliability: 1.25
        worst_margin: 1.25
        cost: 1.15
        sparsity: 1.15
    high_risk_objective:
      enabled: true
      penalty_scale: 80.0
      hard_gate: true
      hard_violation_penalty: 120.0
      weights:
        pd_improvement: 0.60
        gate_pass: 0.15
        residual_pd: 0.25
        short_term: 0.20
        ci: 0.35
        reliability: 0.20
        worst_margin: 0.20
        cost: 0.03
        sparsity: 0.02
      short_term:
        enabled: true
        phase1_cutoff_month: 1
        phase2_cutoff_month: 3
        phase1_share_weight: 1.0
        phase2_share_weight: 0.35
        min_phase1_actions: 1

adaptive_steps:
  enabled: true
  only_denied: true
  growth_factor: 2.0
  max_multiplier: 8.0
  max_attempts_per_feature: 4
  min_pd_improvement: 0.001
  required_share_per_feature: 0.20
  sensitivity_gain: 0.8

denied_target:
  enabled: true
  activation_margin: 0.00
  topk_multiplier: 2.2
  min_topk: 12
  horizons: [3, 6]
  strategies: [balanced, aggressive]
  strict_min_reliability: 0.35
  strict_min_worst_risk_margin: -0.10
  dice_total_cfs_multiplier: 1.25
  dice_max_actions_multiplier: 1.20
  max_actions: 10
  distance_profiles:
    near:
      max_pd_delta: 0.10
      horizons: [3, 6]
      strategies: [balanced, aggressive]
      topk_multiplier: 1.25
      max_actions: 10
      enable_weekly_optimizer: true
      disable_adaptive_steps: false
      skip_dice: false
    mid:
      max_pd_delta: 0.15
      horizons: [3, 6]
      strategies: [balanced, aggressive]
      topk: 10
      max_actions: 8
      enable_weekly_optimizer: true
      disable_adaptive_steps: false
      skip_dice: false
      strict_min_reliability: 0.30
    far:
      max_pd_delta: 1.00
      horizons: [3, 6, 12]
      strategies: [balanced, aggressive]
      topk: 12
      max_actions: 8
      enable_weekly_optimizer: true
      disable_adaptive_steps: false
      skip_dice: false
      strict_min_reliability: 0.30

trajectory:
  enabled: true
  checkpoints_months: [1, 3, 6]
  partial_progress_min_pd_delta: 0.05

phase1_fast_track:
  enabled: true
  denied_only: true
  high_risk_only: true
  prioritized_features:
    - dti
    - revol_util
    - revol_bal
    - loan_amnt
    - installment
  feature_boost_multiplier: 1.40
  step_multiplier: 1.60
  force_phase1_month: true
  append_missing_prioritized: true
  max_append: 2
  min_score_floor: 1.0e-9

high_risk_bridge_kpi:
  enabled: true
  target_pd_delta_to_tau: 0.20
  min_pd_reduction: 0.08

segment_caps:
  enabled: true
  denied_only: true
  income_quantiles: [0.25, 0.50, 0.75]
  risk_band_thresholds:
    near_upper: 0.10
    mid_upper: 0.25
  income_band_multipliers:
    q1: 1.05
    q2: 1.10
    q3: 1.15
    q4: 1.20
  risk_band_multipliers:
    near: 1.20
    mid: 1.45
    high: 2.20
  cap_multiplier_min: 1.00
  cap_multiplier_max: 2.80
  feature_cap_multipliers:
    annual_inc:
      income_band_multipliers:
        q1: 0.85
        q2: 0.90
        q3: 1.00
        q4: 1.10
    dti:
      risk_band_multipliers:
        near: 1.00
        mid: 1.10
        high: 1.20
    revol_util:
      risk_band_multipliers:
        near: 1.00
        mid: 1.10
        high: 1.20

weekly_optimizer:
  enabled: true
  only_denied: true
  weeks: 10
  max_weekly_actions: 2
  weekly_step_scale: 0.50
  min_weekly_improvement: 0.0001
  stop_when_target_hit: true
  optimize_for_gate: true
  objective_bootstrap_b: 60

action_budget:
  enabled: true
  max_actions_regular: 4
  max_actions_denied: 10

search_budget:
  per_customer_time_budget_ms: 1000
  sync_fast_path_enabled: true
  sync_time_budget_ms: 450
  async_deep_path_enabled: true
  candidate_pool_max_size: 10
  stage1_filter_multiplier: 1.6
  stage1_per_source_cap: 5
  regular_horizons: [3, 6]
  regular_strategies: [conservative]
  regular_topk: 6
  novelty_weight: 0.25
  skip_dice_when_internal_approved: true
  skip_dice_for_non_denied: true
  denied_target_max_customers: 300
  denied_target_dynamic_max_enabled: true
  denied_target_dynamic_max_cap: 300
  denied_target_segment_reservation_enabled: true
  denied_target_risk_band_reservation:
    high: 0.50
    mid: 0.25
    near: 0.25
  denied_dice_max_customers: 8
  dice_only_high_risk_denied: false
  min_remaining_budget_for_dice_ms: 220
  min_remaining_budget_for_rule_ms: 80
  hard_max_dice_timeout_ms: 500
  hard_time_budget_enforcement: true
  enable_deterministic_fallback: true

high_risk_profile:
  enabled: true
  denied_target_only: true
  max_pd_delta: 1.00
  topk_multiplier: 1.35
  min_topk: 12
  horizons: [3, 6, 12]
  strategies: [balanced, aggressive]
  force_weekly_optimizer: true
  weekly_weeks: 8
  weekly_max_actions: 2
  max_actions: 8
  min_reliability: 0.30
  min_worst_risk_margin: -0.10
  target_pd_margin_extra: 0.015
  dice_total_cfs_multiplier: 1.40
  dice_max_actions_multiplier: 1.20

feasibility:
  enabled: true
  profile_path: configs/recourse_feasibility.yaml
  enforce_on_internal: true
  enforce_on_dice: true

rule_generator:
  enabled: true
  max_actions: 3
  only_last_resort: true

fairness:
  group_feature: home_ownership
  advantage_tolerance: 0.01
  penalty_sample_n: 3000
  penalty_seed: 42
  denied_target_selection_penalty_weight: 40.0
  denied_dice_selection_penalty_weight: 40.0
  denied_target_fair_share: 0.60
  denied_dice_fair_share: 0.50
  recourse_balance:
    enabled: true
    disadvantaged_penalty_threshold: 0.07
    disadvantaged_min_reliability_scale: 0.88
    disadvantaged_min_worst_margin_shift: -0.02
    advantaged_min_reliability_scale: 1.00
    advantaged_min_worst_margin_shift: 0.00
  segment_cap_boost:
    enabled: true
    only_denied_target: true
    only_high_risk: true
    min_penalty: 0.03
    penalty_reference: 0.07
    cap_multiplier_boost_max: 1.35
    feature_cap_multiplier_boost_max: 1.20
    target_pd_margin_extra_max: 0.02
  postprocess_guard:
    enabled: true
    target_equalized_odds_gap_delta: 0.01
    target_approval_gap_after: 0.10
    target_recourse_success_gap: 0.10
    max_demotions: 40
    max_iterations: 120
    min_denied_to_approved_lift: 0.09
    min_denied_high_risk_lift: 0.03
    priority_order:
      - recourse_success_gap
      - approval_gap_after
      - equalized_odds_gap_delta

beam_search:
  width: 5                     # Beam genişliği
  max_actions: 10               # Bir planda maksimum aksiyon sayısı
  max_iterations: 200

cost_weights:
  lambda_l1: 1.0               # L1 uzaklık ağırlığı
  lambda_time: 0.5             # Zaman maliyeti ağırlığı
  lambda_financial: 0.8        # Finansal maliyet ağırlığı

output:
  save_json: true
  save_csv: true
  path: artifacts/runs/
