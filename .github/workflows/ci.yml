name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cc_owner
          POSTGRES_PASSWORD: cc_owner_dev
          POSTGRES_DB: credit_coach
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cc_owner -d credit_coach"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CREDIT_COACH_TEST_DB_URL: postgresql+psycopg://cc_owner:cc_owner_dev@localhost:55432/credit_coach
      CREDIT_COACH_APP_DB_URL: postgresql+psycopg://cc_app:cc_app_dev@localhost:55432/credit_coach
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q -rs
      - name: Frozen bundle hashes match bundle.lock.json
        run: uv run python -m credit_coach.bundle verify

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd frontend && npm ci
      - run: make types
      - name: Generated OpenAPI and types match the commit
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts
      - run: cd frontend && npm run typecheck
